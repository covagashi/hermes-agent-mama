<!doctype html>
<!-- Fixture sintética F1 — campos de contraseña. Los `value=` están a propósito:
     el snapshot NUNCA debe incluirlos (§2.6, checklist de seguridad §8). -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cambiar contraseña — Tienda Ejemplo</title>
</head>
<body>
  <main>
    <h1>Cambiar contraseña</h1>
    <form action="/clave" method="post">
      <label for="actual">Contraseña actual</label>
      <input id="actual" name="actual" type="password" value="valor-que-no-debe-verse">
      <label for="nueva">Contraseña nueva</label>
      <input id="nueva" name="nueva" type="password">
      <label for="nota">Nota opcional</label>
      <input id="nota" name="nota" type="text" value="este valor tampoco sale">
      <button type="submit">Guardar</button>
    </form>
  </main>
</body>
</html>
