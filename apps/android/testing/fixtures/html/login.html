<!doctype html>
<!-- Fixture sintética F1 — login de "Tienda Ejemplo". Usuario/contraseña de
     ejemplo: usuario / cualquiera (nunca se envía a ningún sitio). -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Entrar — Tienda Ejemplo</title>
</head>
<body>
  <main>
    <h1>Entrar en Tienda Ejemplo</h1>
    <p>Accede con tu cuenta de hermes.example.invalid</p>
    <form action="/entrar" method="post">
      <label for="user">Usuario</label>
      <input id="user" name="user" type="text" autocomplete="username">
      <label for="pass">Contraseña</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
    <a href="/recordar">¿Olvidaste tu contraseña?</a>
    <p>¿No tienes cuenta? Pídesela a tu familia.</p>
  </main>
</body>
</html>
